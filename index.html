<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Dashboard Financeiro</h1>
    </header>

    <main>
        <!-- Cards -->
        <section class="cards">
            <div class="card">
                <h3>Faturamento</h3>
                <p id="faturamento">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Gastos</h3>
                <p id="gastos">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Lucro</h3>
                <p id="lucro">R$ 0,00</p>
            </div>
        </section>

        <!-- Formulário -->
        <section class="form-section">
            <h2>Adicionar Registro</h2>
            <form id="registroForm">
                <input type="text" id="nome" placeholder="Nome" required>
                <input type="number" id="valor" placeholder="Valor" min="0.01" step="0.01" required>
                <select id="tipo" required>
                    <option value="">Selecione Tipo</option>
                    <option value="faturamento">Faturamento</option>
                    <option value="despesa">Despesa</option>
                </select>
                <input type="month" id="mesAno" required>
                <button type="submit">Adicionar</button>
            </form>
        </section>

        <!-- Tabela -->
        <section class="tabela-section">
            <h2>Registros Cadastrados</h2>
            <table id="registrosTable">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Valor</th>
                        <th>Tipo</th>
                        <th>Mês/Ano</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button id="limparDados">Limpar Todos</button>
        </section>

        <!-- Gráficos -->
        <section class="graficos-section">
            <h2>Gráfico Mensal</h2>
            <canvas id="graficoMensal" width="400" height="200"></canvas>

            <h2>Distribuição de Despesas</h2>
            <canvas id="graficoPizza" width="400" height="200"></canvas>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
